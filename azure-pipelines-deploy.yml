# CD pipeline (Azure DevOps) — build the SPA and upload it to the Storage static
# website ($web). NO infra is created here. A new frontend version = run this.
#
# Auth: AzureCLI task uses the ARM service connection `sc-ms-process-deploy`,
# backed by the OIDC deploy SP (Terraform deploy-identity.tf), which holds
# Storage Blob Data Contributor on the SPA storage account. No secrets here.
#
# API_BASE_URL is a pipeline variable: the App Service URL + /api/v1.

trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: "sc-ms-process-deploy"
  storageAccount: "nmrwpmsprocspaprd"
  NODE_VERSION: "20.x"

stages:
  - stage: build
    displayName: "Build SPA"
    jobs:
      - job: build
        displayName: "npm build"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "$(NODE_VERSION)"
            displayName: "Use Node $(NODE_VERSION)"
          - script: npm ci
            displayName: "Install deps"
          - script: npm run build
            displayName: "Build (tsc + vite)"
            env:
              VITE_BASE_PATH: "/"
              VITE_AUTH_BYPASS: "false"
              VITE_AUTH_PROVIDER: "azure-builtin"
              VITE_MOCK_API: "false"
              VITE_BRIDGE_API_URL: "$(API_BASE_URL)"
          - publish: dist
            artifact: spa
            displayName: "Publish dist artifact"

  - stage: deploy
    displayName: "Deploy to Storage \\$web"
    dependsOn: build
    condition: succeeded()
    jobs:
      - deployment: deploy_spa
        displayName: "Upload to \\$web"
        environment: "ms-process-prod" # attach approvals/checks here
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: spa
                - task: AzureCLI@2
                  displayName: "Upload build to \\$web"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az storage blob upload-batch \
                        --account-name "$(storageAccount)" \
                        --auth-mode login \
                        --destination '$web' \
                        --source "$(Pipeline.Workspace)/spa" \
                        --overwrite true
