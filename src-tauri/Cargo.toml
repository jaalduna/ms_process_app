[package]
name = "ms-process-app"
version = "0.3.1"
edition = "2021"

[lib]
name = "ms_process_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[features]
# Bundle + launch the mock backend as a sidecar (demo distribution build).
# Enable with: tauri build --config tauri.demo.conf.json -- --features mock-sidecar
mock-sidecar = ["dep:tauri-plugin-shell"]
