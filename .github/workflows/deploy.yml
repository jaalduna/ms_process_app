name: Deploy SPA to Azure Storage ($web)

# New-version deploy of the frontend: build the React app and upload it to the
# Storage static-website ($web) container. Auth is OIDC to the shared deploy SP
# (Storage Blob Data Contributor) — no API tokens or access keys.
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   vars:    AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#            STORAGE_ACCOUNT (nmrwpmsprocspaprd), API_BASE_URL (App Service URL + /api/v1)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: "/"
          VITE_AUTH_BYPASS: "false"
          VITE_AUTH_PROVIDER: "azure-builtin"
          VITE_MOCK_API: "false"
          VITE_BRIDGE_API_URL: ${{ vars.API_BASE_URL }}
        run: npm run build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to $web
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ vars.STORAGE_ACCOUNT }}" \
              --auth-mode login \
              --destination '$web' \
              --source dist \
              --overwrite true
