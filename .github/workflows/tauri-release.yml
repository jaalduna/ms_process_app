name: Tauri Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Pin production config
        shell: pwsh
        run: |
          # Bake the corp bridge URL into the static bundle — relative
          # "/api/v1" only works behind the Vite dev proxy, not inside
          # the Tauri webview (origin = tauri://localhost).
          (Get-Content public/config.js) `
            -replace '"/api/v1"', '"http://myworkspace.adds.wp.numerator.com:8000/api/v1"' `
            | Set-Content -Encoding utf8 public/config.js
          # Disable updater artifacts — CI has no signing key, and the
          # build would otherwise fail with "Tauri signing key required".
          (Get-Content src-tauri/tauri.conf.json) `
            -replace '"createUpdaterArtifacts": true', '"createUpdaterArtifacts": false' `
            | Set-Content -Encoding utf8 src-tauri/tauri.conf.json

      - name: npm ci
        run: npm ci

      - name: Build Tauri (Windows NSIS)
        env:
          VITE_AUTH_BYPASS: 'true'
        run: npm run tauri:build -- --bundles nsis

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ms-process-app-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
